# 自动发布：推送 v* 标签时构建并发布单文件 BWM.exe 到 GitHub Releases
# 用法：git tag v0.3.0 && git push origin v0.3.0
# 说明：此工作流在 Windows 官方 runner 上安装 MinGW 与 Qt（MinGW 版），
#       与本地构建环境保持一致，避免 MSVC 差异。
#       发布产物为单文件 BWM.exe（Enigma Virtual Box 打包，无需 Qt DLL），
#       打包工具 enigmavbconsole.exe 已随仓库提供（tools/ 目录）。
name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # 允许在 Actions 页面手动触发（调试/重跑无需删建 tag）
  workflow_dispatch:

# 同一时刻只保留一个运行：新触发自动取消旧的（含 queued/排队中的）
concurrency:
  group: build-release
  cancel-in-progress: true

# 允许创建 GitHub Release（默认 GITHUB_TOKEN 只有只读权限）
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt + MinGW toolchain (msvcrt, matches local build)
        uses: jurplel/install-qt-action@v4
        with:
          # 使用 aqt 可正常安装的 6.8 LTS：aqt 3.3.0 不识别 Qt 6.11+ 的
          # 新目录结构（qt6_XXXX_mingw/），6.8 为旧结构，安装稳定。
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          # Qt 6.8.3 的 mingw 包运行时为 MinGW 13.1（见安装日志），配套工具链用 1310
          tools: 'tools_mingw1310'

      - name: Locate Qt and MinGW toolchain
        run: |
          # 定位 Qt 前缀：优先 Qt6_DIR 环境变量，否则在 runner workspace 递归查找 qmake6.exe
          $qtPrefix = $env:Qt6_DIR
          if (-not $qtPrefix -or -not (Test-Path (Join-Path $qtPrefix 'bin/qmake6.exe'))) {
            $qmake = Get-ChildItem -Path $env:RUNNER_WORKSPACE -Recurse -Filter 'qmake6.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $qmake) {
              Write-Error 'qmake6.exe not found under runner workspace'
              exit 1
            }
            $qtPrefix = Split-Path (Split-Path $qmake.FullName -Parent) -Parent
          }
          Write-Host "Qt prefix: $qtPrefix"
          echo "Qt6_DIR=$qtPrefix" >> $env:GITHUB_ENV

          # 定位 MinGW g++：PATH 中已存在则直接用，否则在 Qt Tools 目录递归查找
          $gcc = Get-Command g++ -ErrorAction SilentlyContinue
          if (-not $gcc) {
            $toolsRoot = Join-Path (Split-Path $qtPrefix -Parent) 'Tools'
            $gccFile = Get-ChildItem -Path $toolsRoot -Recurse -Filter 'g++.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $gccFile) {
              Write-Error "MinGW g++ not found under $toolsRoot"
              exit 1
            }
            $gccDir = Split-Path $gccFile.FullName -Parent
            Write-Host "MinGW g++ directory: $gccDir"
            echo "$gccDir" >> $env:GITHUB_PATH
          }

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          "-DCMAKE_PREFIX_PATH=$env:Qt6_DIR"
          "-DQt6_DIR=$env:Qt6_DIR/lib/cmake/Qt6"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Deploy runtime (windeployqt)
        run: |
          $windeployqt = Join-Path $env:Qt6_DIR 'bin/windeployqt.exe'
          & $windeployqt --release --compiler-runtime build/src/bwm.exe

      - name: Package single exe (Enigma Virtual Box)
        shell: pwsh
        run: |
          # 第一步：部署 Qt 运行时到 release/ 目录（exe + DLL + 插件）
          pwsh -File package.ps1
          # 第二步：用仓库内 tools/enigmavbconsole.exe 打包成单文件 BWM.exe
          pwsh -File package_single.ps1
          if (-not (Test-Path 'BWM.exe')) { Write-Error 'BWM.exe 未生成'; exit 1 }
          Write-Host "单文件大小: $([math]::Round((Get-Item 'BWM.exe').Length/1MB,1)) MB"

      - name: Extract release notes from CHANGELOG
        # 从 CHANGELOG.md 提取当前 tag 对应版本的段落（Added / Fixed / Changed 等），
        # 作为 Release 正文，保证「Release 页面描述新增功能与修复的 Bug」与 CHANGELOG 一致。
        # 提取不到时（例如忘记把「未发布」改成具体版本号）只警告并回退到自动生成的说明，不中断发布。
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # 先建空文件：Create Release 步骤会用 body_path 读取它，文件缺失会导致 action 报错
          New-Item -Path release_notes.md -ItemType File -Force | Out-Null
          $tag     = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          Write-Host "tag=$tag version=$version"
          $lines   = Get-Content -Path CHANGELOG.md -Encoding UTF8
          $pattern = '^##\s*\[' + [regex]::Escape($version) + '\]'
          $start   = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $pattern) { $start = $i; break }
          }
          if ($start -lt 0) {
            Write-Warning "CHANGELOG.md 中没有 [$version] 段落，Release 说明将只含自动生成内容"
            exit 0
          }
          # 段落范围：本级标题之后，直到下一个「## 」二级标题
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s') { $end = $i; break }
          }
          $text = (($lines[($start + 1)..($end - 1)]) -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($text)) {
            Write-Warning "CHANGELOG.md 的 [$version] 段落为空，Release 说明将只含自动生成内容"
            exit 0
          }
          Set-Content -Path release_notes.md -Value $text -Encoding UTF8
          Write-Host "已生成 release_notes.md（$($text.Length) 字符）"

      - name: Create Release
        # 仅打 tag（v*）时创建 GitHub Release；手动触发时跳过
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 只发布单文件可执行程序（免安装、无需 Qt DLL）
          files: BWM.exe
          # 正文 = CHANGELOG 对应版本段落（见上一步），自动生成的 commit 列表追加其后
          body_path: release_notes.md
          generate_release_notes: true

      - name: Upload artifact (manual runs)
        # 手动触发时把 zip 上传到 Artifacts，便于下载验证
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: BWM-windows-single
          path: BWM.exe
